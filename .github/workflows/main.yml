name: CI

# Rebuilds the cloud/Savanna UI bundle from source and triggers the docs site
# build. On every push to main we run the gulp bundle, refresh
# build/ui-bundle-cloud.zip (the bundle cloud-docs / Savanna + Cloud Classic
# consume), commit it back, and ping the Netlify build hook so the docs site
# rebuilds with the latest theme.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Needed so the workflow can commit the rebuilt bundle back to main.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint UI sources
        run: npx gulp lint

      # gulp bundle always emits build/ui-bundle.zip from src/. Since the
      # cloud theme now lives in src/ on main, that output IS the cloud-themed
      # bundle, which we publish as ui-bundle-cloud.zip. We intentionally do NOT
      # commit ui-bundle.zip so other product docs keep the shared default.
      - name: Build cloud UI bundle
        run: |
          npx gulp bundle
          cp build/ui-bundle.zip build/ui-bundle-cloud.zip

      - name: Commit refreshed cloud bundle
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ISOLATION GUARANTEE: other products consume the shared
          # build/ui-bundle.zip, which must NEVER carry the cloud theme.
          # gulp rebuilt a themed ui-bundle.zip in the working tree, so restore
          # the committed (neutral) version before staging anything.
          git checkout -- build/ui-bundle.zip

          # Stage ONLY the cloud bundle, by explicit path.
          git add --force build/ui-bundle-cloud.zip

          # Tripwire: fail loudly if the shared bundle somehow got staged, so a
          # future edit to this workflow can never leak the cloud theme.
          if ! git diff --cached --quiet -- build/ui-bundle.zip; then
            echo "ERROR: build/ui-bundle.zip changed; refusing to publish the cloud theme to the shared bundle." >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Cloud bundle unchanged; nothing to commit."
          else
            git commit -m "build(ui): rebuild cloud UI bundle from source [skip ci]"
            git push origin HEAD:main
          fi

      - name: Trigger Netlify build hook
        if: github.event_name != 'pull_request'
        run: |
          echo "Making curl call to Netlify build hook"
          curl -X POST -d '{}' "${{ secrets.BUILD_HOOK }}"
