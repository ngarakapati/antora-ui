name: CI

# On pull requests: lint and build the UI bundle so a broken gulp/bundle
# cannot merge. The zip is not committed from PRs.
#
# On push to main: rebuild build/ui-bundle.zip from source, commit it back
# if it changed, then ping Netlify once so docs sites that consume
# https://github.com/tigergraph/antora-ui/blob/main/build/ui-bundle.zip?raw=true
# pick up the new bundle. The zip commit uses [skip ci] and is ignored by
# the Netlify step so that second push cannot start a second docs deploy.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build UI bundle
        run: npx gulp bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: build/ui-bundle.zip
          if-no-files-found: error

      - name: Publish bundle to main
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/ui-bundle.zip
          if git diff --cached --quiet; then
            echo "UI bundle unchanged; nothing to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "build(ui): rebuild UI bundle from source [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # One Netlify deploy per UI change: only after a new zip is on main.
      # Do not ping for PRs, the [skip ci] zip commit, or github-actions[bot]
      # (that second push would otherwise rebuild the docs site again).
      - name: Trigger Netlify build hook
        if: >
          github.ref == 'refs/heads/main' &&
          github.actor != 'github-actions[bot]' &&
          !contains(github.event.head_commit.message, '[skip ci]') &&
          (github.event_name == 'workflow_dispatch' || steps.publish.outputs.published == 'true')
        run: |
          echo "Making curl call to Netlify build hook"
          curl -X POST -d '{}' "${{ secrets.BUILD_HOOK }}"
